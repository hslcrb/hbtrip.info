	<!-- Accessibility: allow Enter/Space to activate SVG groups with role="button" -->
	<script>
		(function(){
			// Make sure all svg <g> with onclick are focusable and have role=button
			document.querySelectorAll('svg.svg-image g[onclick]').forEach(function(g){
				if(!g.hasAttribute('role')) g.setAttribute('role','button');
				if(!g.hasAttribute('tabindex')) g.setAttribute('tabindex','0');
			});

			// Keydown handler: Enter (13) or Space (32) should trigger click
			document.addEventListener('keydown', function(e){
				var t = e.target;
				if(t && t.matches && t.matches('svg.svg-image g[role="button"]')){
					if(e.key === 'Enter' || e.key === ' ' || e.keyCode === 13 || e.keyCode === 32){
						e.preventDefault();
						// trigger the group's onclick if present
						var onclick = t.getAttribute('onclick');
						if(onclick){
							// Use Function to execute the inline handler in global scope
							(new Function(onclick))();
						}
					}
				}
			});
		})();
	</script>
