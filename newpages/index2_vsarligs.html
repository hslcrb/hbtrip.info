  <script>
    // 비디오 컨트롤 아이콘 동작
  // (heroVideo 단일 변수는 더 이상 사용하지 않음)
    const playPauseBtn = document.getElementById('videoPlayPause');
    const pauseIcon = document.getElementById('pauseIcon');
    const playIcon = document.getElementById('playIcon');
    const forwardBtn = document.getElementById('videoForward');
    const rewindBtn = document.getElementById('videoRewind');
    function updatePlayPauseIcon() {
      if(heroVideo.paused) {
        pauseIcon.style.display = 'none';
        playIcon.style.display = '';
        playPauseBtn.title = '재생';
      } else {
        pauseIcon.style.display = '';
        playIcon.style.display = 'none';
        playPauseBtn.title = '일시정지';
      }
    }
    playPauseBtn.onclick = function() {
      if(heroVideo.paused) {
        heroVideo.play();
      } else {
        heroVideo.pause();
      }
      setTimeout(updatePlayPauseIcon, 50);
    };
    heroVideo.addEventListener('play', updatePlayPauseIcon);
    heroVideo.addEventListener('pause', updatePlayPauseIcon);
    forwardBtn.onclick = function() {
      heroVideo.currentTime = Math.min(heroVideo.duration, heroVideo.currentTime + 2);
    };
    rewindBtn.onclick = function() {
      heroVideo.currentTime = Math.max(0, heroVideo.currentTime - 2);
    };
    // 최초 상태 반영
    updatePlayPauseIcon();
  </script>

          heroVideo.style.opacity = 0;
          setTimeout(()=>{
            heroVideo.src = '해운대_밤.mp4';
            heroVideo.load();
            heroVideo.play();
            heroVideo.style.opacity = 1;
            currentVideo = 'night';
          }, 350);
        }
      } else {
        sunIcon.style.display = '';
        moonIcon.style.display = 'none';
        if(currentVideo !== 'day') {
          heroVideo.style.opacity = 0;
          setTimeout(()=>{
            heroVideo.src = '해운대_낮.mp4';
            heroVideo.load();
            heroVideo.play();
            heroVideo.style.opacity = 1;
            currentVideo = 'day';
          }, 350);
        }
      }
      localStorage.setItem('theme', theme);
    }
    function getPreferredTheme() {
      const saved = localStorage.getItem('theme');
      if(saved) return saved;
      return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    }
    themeToggle.onclick = function() {
      const current = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      setTheme(current);
    };
    setTheme(getPreferredTheme());

    // 네비게이션 투명/흰색 전환
    const navbar = document.getElementById('navbar');
    function onScrollNav() {
      if(window.scrollY > 60) {
        navbar.classList.add('scrolled');
      } else {
        navbar.classList.remove('scrolled');
      }
    }
    window.addEventListener('scroll', onScrollNav);
    onScrollNav();

    // 비디오 반복+페이드
  // const heroVideo = document.getElementById('heroVideo'); // 2중 선언 제거, heroVideoA/B만 사용
    let fadeTimeout = null;
    heroVideo.addEventListener('ended', () => {
      heroVideo.style.opacity = 0;
      fadeTimeout = setTimeout(() => {
        heroVideo.currentTime = 0;
        heroVideo.play();
        heroVideo.style.opacity = 1;
      }, 400);
    });
    // 비디오 우클릭/드래그/저장/프레임저장 방지
