<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HBTrip Git 뮤지엄</title>
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <style>
    @font-face{font-family:'Pretendard-Regular';src:url('https://fastly.jsdelivr.net/gh/Project-Noonnu/noonfonts_2107@1.1/Pretendard-Regular.woff')format('woff');font-weight:400;}
    :root{--bg:#0f0f14;--card:#1a1a24;--text:#e4e4ec;--muted:#8888a0;--accent:#3b82f6;--line:#2a2a3a;--green:#10b981;--amber:#f59e0b;--rose:#f43f5e;--radius:14px;}
    *{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:'Pretendard-Regular','Apple SD Gothic Neo',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}
    header{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10;}
    .hdr{max-width:1100px;margin:0 auto;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;}
    .hdr h1{font-size:18px;font-weight:800;display:flex;align-items:center;gap:8px;}
    .hdr h1 .badge{font-size:10px;font-weight:600;color:var(--accent);background:color-mix(in srgb,var(--accent)15%,transparent);padding:2px 10px;border-radius:999px;}
    .hdr nav{display:flex;gap:6px;flex-wrap:wrap;}
    .hdr nav a{padding:6px 14px;border-radius:999px;font-size:12px;font-weight:700;text-decoration:none;background:var(--bg);border:1px solid var(--line);color:var(--muted);transition:all .2s;}
    .hdr nav a:hover{border-color:var(--accent);color:var(--accent);}
    .main{max-width:1100px;margin:0 auto;padding:24px 20px;}
    .intro{text-align:center;margin-bottom:28px;}
    .intro h2{font-size:24px;font-weight:800;}
    .intro p{color:var(--muted);font-size:14px;margin-top:4px;}
    .intro .gh-link{display:inline-flex;align-items:center;gap:6px;margin-top:8px;padding:6px 18px;border-radius:999px;background:var(--card);border:1px solid var(--line);color:var(--text);text-decoration:none;font-size:12px;font-weight:600;transition:all .2s;}
    .intro .gh-link:hover{border-color:var(--accent);}
    .live-badge{display:inline-flex;align-items:center;gap:4px;padding:3px 12px;border-radius:999px;background:rgba(16,185,129,.15);color:var(--green);font-size:11px;font-weight:700;}
    .live-badge .dot{width:6px;height:6px;border-radius:50%;background:var(--green);animation:pulse 1.5s infinite;}
    @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.3;}}
    .stats{display:flex;gap:16px;justify-content:center;margin-bottom:24px;flex-wrap:wrap;}
    .stat{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:12px 20px;text-align:center;}
    .stat .num{font-size:22px;font-weight:800;color:var(--accent);}
    .stat .lbl{font-size:11px;color:var(--muted);margin-top:2px;}
    .commit{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:10px;overflow:hidden;transition:border-color .2s;}
    .commit:hover{border-color:color-mix(in srgb,var(--accent)40%,var(--line));}
    .commit-header{padding:14px 18px;display:flex;align-items:center;gap:12px;cursor:pointer;-webkit-user-select:none;user-select:none;}
    .commit-header:hover{background:rgba(255,255,255,.02);}
    .commit .arrow{transition:transform .3s;font-size:12px;color:var(--muted);flex-shrink:0;}
    .commit.open .arrow{transform:rotate(90deg);}
    .commit .date-box{text-align:center;flex-shrink:0;}
    .commit .date-box .d{font-size:16px;font-weight:800;color:var(--accent);line-height:1.1;}
    .commit .date-box .m{font-size:10px;color:var(--muted);}
    .commit .msg-box{flex:1;min-width:0;}
    .commit .msg-box .msg{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
    .commit .msg-box .hash{font-size:10px;color:var(--muted);font-family:monospace;display:flex;align-items:center;gap:6px;margin-top:1px;flex-wrap:wrap;}
    .commit .msg-box .hash a{color:var(--accent);text-decoration:none;}
    .commit .msg-box .hash a:hover{text-decoration:underline;}
    .gh-commit-link{display:inline-flex;align-items:center;gap:4px;padding:2px 10px;border-radius:999px;background:rgba(59,130,246,.1);color:var(--accent);text-decoration:none;font-size:10px;font-weight:600;transition:all .2s;}
    .gh-commit-link:hover{background:rgba(59,130,246,.2);}
    .commit-body{display:none;border-top:1px solid var(--line);padding:14px 18px;font-size:12px;color:var(--muted);text-align:center;}
    .commit.open .commit-body{display:block;}
    .commit-body .gh-dir-btn{display:inline-flex;align-items:center;gap:6px;padding:8px 20px;border-radius:999px;background:rgba(59,130,246,.1);color:var(--accent);text-decoration:none;font-size:12px;font-weight:600;transition:all .2s;}
    .commit-body .gh-dir-btn:hover{background:rgba(59,130,246,.2);}
    @media(max-width:600px){.hdr{flex-direction:column;align-items:flex-start;gap:8px;}.commit-header{flex-wrap:wrap;gap:8px;}.commit .date-box .d{font-size:14px;}.commit .msg-box .msg{font-size:12px;}.stats{gap:8px;}.stat{padding:10px 14px;}.stat .num{font-size:18px;}}
    .search-bar{display:flex;gap:8px;margin-bottom:20px;}
    .search-bar input{flex:1;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:10px 18px;font-family:inherit;font-size:13px;color:var(--text);outline:none;transition:border-color .2s;}
    .search-bar input:focus{border-color:var(--accent);}
    .search-bar input::placeholder{color:var(--muted);}
    .loading{text-align:center;padding:40px;color:var(--muted);font-size:14px;}
    .loading .spinner{display:inline-block;width:24px;height:24px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;margin-bottom:10px;}
    @keyframes spin{to{transform:rotate(360deg);}}
    .error-msg{text-align:center;padding:30px;color:var(--rose);font-size:13px;}
    .error-msg a{color:var(--accent);}
    .footer{text-align:center;padding:20px;font-size:12px;color:var(--muted);}
    .footer a{color:var(--accent);text-decoration:none;}
  </style>
</head>
<body>
<header>
  <div class="hdr">
    <h1>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><polyline points="12,6 12,12 16,14"/></svg>
      Git 뮤지엄 <span class="badge">오픈소스</span>
    </h1>
    <nav>
      <a href="timeline.html">타임라인</a>
      <a href="time.html">카운트다운</a>
      <a href="home.html">학과 선택</a>
      <a href="index.html">메인</a>
    </nav>
  </div>
</header>
<div class="main">
  <div class="intro">
    <h2>📜 전체 커밋 기록 <span class="live-badge"><span class="dot"></span> GitHub API 실시간</span></h2>
    <p>GitHub REST API로 저장소 데이터를 실시간 조회합니다</p>
    <a class="gh-link" href="https://github.com/hslcrb/hbtrip.info" target="_blank">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/></svg>
      hslcrb/hbtrip.info
    </a>
  </div>

  <div class="stats" id="stats">
    <div class="stat"><div class="num">···</div><div class="lbl">깃허브에서 불러오는 중</div></div>
  </div>

  <div class="search-bar">
    <input id="searchInput" type="text" placeholder="커밋 메시지 검색..." autocomplete="off">
  </div>

  <div id="commitList"><div class="loading"><div class="spinner"></div>GitHub API에서 커밋 내역을 불러오는 중...</div></div>
</div>
<div class="footer">
  <a href="https://github.com/hslcrb/hbtrip.info" target="_blank">GitHub 저장소</a>
  <span style="color:var(--line);margin:0 6px;">·</span>
  <a href="timeline.html">타임라인</a>
  <span style="color:var(--line);margin:0 6px;">·</span>
  <a href="docs/version-history.md">버전 히스토리</a>
</div>

<script>
const API = 'https://api.github.com/repos/hslcrb/hbtrip.info/commits?per_page=100&sha=main';
const REPO = 'https://github.com/hslcrb/hbtrip.info';

function sanitize(str) {
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

async function fetchCommits() {
  const cached = sessionStorage.getItem('museumCommits');
  if (cached) {
    try { return JSON.parse(cached); } catch(e) {}
  }
  const res = await fetch(API);
  if (!res.ok) throw new Error('HTTP ' + res.status + ' ' + res.statusText);
  const data = await res.json();
  const commits = data.map(c => ({
    hash: c.sha,
    date: c.commit.author ? c.commit.author.date.slice(0,10) : c.commit.committer.date.slice(0,10),
    msg: c.commit.message.split('\n')[0]
  }));
  commits.reverse();
  try { sessionStorage.setItem('museumCommits', JSON.stringify(commits)); } catch(e) {}
  return commits;
}

function render(commits, allCommits) {
  const list = document.getElementById('commitList');
  const stats = document.getElementById('stats');
  stats.innerHTML = `
    <div class="stat"><div class="num">${allCommits.length}</div><div class="lbl">총 커밋</div></div>
    <div class="stat"><div class="num">${allCommits[0]?.date || '-'}</div><div class="lbl">최초 커밋</div></div>
    <div class="stat"><div class="num">${allCommits[allCommits.length-1]?.date || '-'}</div><div class="lbl">최근 커밋</div></div>
  `;
  if (commits.length === 0) {
    list.innerHTML = '<div class="error-msg">검색 결과가 없습니다</div>';
    return;
  }
  list.innerHTML = '';
  commits.forEach(c => {
    const div = document.createElement('div');
    div.className = 'commit';
    div.innerHTML = `
      <div class="commit-header">
        <span class="arrow">▶</span>
        <div class="date-box"><div class="d">${c.date.slice(8)}</div><div class="m">${c.date.slice(0,7)}</div></div>
        <div class="msg-box">
          <div class="msg">${sanitize(c.msg)}</div>
          <div class="hash">
            <a href="${REPO}/commit/${c.hash}" target="_blank" title="GitHub에서 이 커밋 보기">${c.hash.slice(0,7)}</a>
            <a class="gh-commit-link" href="${REPO}/tree/${c.hash}" target="_blank">🌲 Browse files</a>
            <a class="gh-commit-link" href="${REPO}/commit/${c.hash}" target="_blank">🔍 Diff</a>
          </div>
        </div>
      </div>
      <div class="commit-body">
        <a class="gh-dir-btn" href="${REPO}/tree/${c.hash}" target="_blank">📂 GitHub에서 이 커밋 시점 파일 보기</a>
        <br><br>
        <a class="gh-dir-btn" href="${REPO}/commit/${c.hash}" target="_blank">📝 GitHub에서 변경 내용 보기 (Diff)</a>
      </div>
    `;
    div.querySelector('.commit-header').addEventListener('click', () => div.classList.toggle('open'));
    list.appendChild(div);
  });
}

(async function init() {
  const search = document.getElementById('searchInput');
  let allCommits = [];

  try {
    allCommits = await fetchCommits();
  } catch (err) {
    document.getElementById('commitList').innerHTML = `<div class="error-msg">
      ❌ GitHub API 호출 실패: ${sanitize(err.message)}
      <br><br>저장소가 public인지 확인하세요.<br>
      <a href="${REPO}/commits/main" target="_blank">→ GitHub에서 직접 보기</a>
    </div>`;
    document.getElementById('stats').innerHTML = `
      <div class="stat"><div class="num">-</div><div class="lbl">API 오류</div></div>
    `;
    return;
  }

  let filtered = allCommits;
  function apply() {
    const q = search.value.trim().toLowerCase();
    if (!q) { filtered = allCommits; render(filtered, allCommits); return; }
    filtered = allCommits.filter(c => c.msg.toLowerCase().includes(q));
    render(filtered, allCommits);
  }
  render(allCommits, allCommits);
  search.addEventListener('input', apply);
})();
</script>
</body>
</html>
