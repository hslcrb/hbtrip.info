    <script>
    const TARGET_ISO = '2025-10-15T07:00:00+09:00';
    let offsetMs = 0, synced = false, lastSyncRTT = null;

    async function syncServerTime() {
        const url = "https://worldtimeapi.org/api/timezone/Asia/Seoul";
        try {
            const t0 = Date.now();
            const res = await fetch(url, { cache: "no-store" });
            const t1 = Date.now();
            if (!res.ok) throw new Error("HTTP " + res.status);
            const data = await res.json();
            const serverDate = new Date(data.datetime);
            const clientMid = Math.floor((t0 + t1) / 2);
            offsetMs = serverDate.getTime() - clientMid;
            lastSyncRTT = t1 - t0;
            try { localStorage.setItem('timeOffsetMs', String(offsetMs)); localStorage.setItem('timeOffsetAt', String(Date.now())); } catch(e){}
            window.getSyncedNow = () => new Date(Date.now() + offsetMs);
            synced = true;
            renderClockOnce();
        } catch (err) {
            console.error("시간 동기화 실패:", err);
            try {
                const stored = localStorage.getItem('timeOffsetMs');
                if (stored !== null) {
                    offsetMs = Number(stored);

        function updateConfetti(){angle+=0.01;for(let i=0;i<confetti.length;i++){let c=confetti[i];c.y+=(Math.cos(angle+c.d)+3+c.r/2)*0.8;c.x+=Math.sin(angle);c.tiltAngle+=c.tiltAngleIncremental;c.tilt=Math.sin(c.tiltAngle)*15;if(c.y>canvas.height){c.x=Math.random()*canvas.width;c.y=-10;}}}

                let isDown = false, startX=0, startY=0, origLeft=0, origTop=0;
                box.addEventListener('mousedown', (e) => { isDown = true; box.style.cursor = 'grabbing'; startX = e.clientX; startY = e.clientY; const rect = box.getBoundingClientRect(); origLeft = rect.left; origTop = rect.top; box.style.position = 'fixed'; box.style.left = origLeft + 'px'; box.style.top = origTop + 'px'; });
                window.addEventListener('mousemove', (e) => { if (!isDown) return; const dx = e.clientX - startX, dy = e.clientY - startY; box.style.left = (origLeft + dx) + 'px'; box.style.top = (origTop + dy) + 'px'; });
                window.addEventListener('mouseup', () => { if (!isDown) return; isDown = false; box.style.cursor = 'grab'; });
                box.addEventListener('touchstart', (e) => { isDown = true; const t = e.touches[0]; startX = t.clientX; startY = t.clientY; const rect = box.getBoundingClientRect(); origLeft = rect.left; origTop = rect.top; box.style.position='fixed'; box.style.left = origLeft + 'px'; box.style.top = origTop + 'px'; }, {passive:false});
                window.addEventListener('touchmove', (e) => { if (!isDown) return; const t = e.touches[0]; const dx = t.clientX - startX, dy = t.clientY - startY; box.style.left = (origLeft + dx) + 'px'; box.style.top = (origTop + dy) + 'px'; }, {passive:false});
                window.addEventListener('touchend', () => { isDown = false; });
            } catch(e){}
        } catch(e){}

        window.addEventListener('keydown', (e) => { if (!finalShown) return; if (e.key === 'Enter') { e.preventDefault(); toggleAudio(); } });

        window.addEventListener('resize', () => { const canvas = document.getElementById('confettiCanvas'); if (canvas) { canvas.width = window.innerWidth; canvas.height = window.innerHeight; } });

        document.addEventListener('DOMContentLoaded', function() {
            const emoji = document.getElementById('celebrationEmoji');
            if (emoji) { emoji.addEventListener('contextmenu', e => e.preventDefault()); emoji.addEventListener('dragstart', e => e.preventDefault()); emoji.addEventListener('selectstart', e => e.preventDefault()); }
        });
    }

    initTimeSettings();
    startPage();
    </script>
</body>
</html>
